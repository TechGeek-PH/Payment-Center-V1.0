name: Import signed TechGeekPH Client v3.1.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/import-client-v310.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download permanent-signed APK artifact
        run: |
          curl --fail --location --retry 3 \
            'https://sdmntpraustraliaeast.oaiusercontent.com/files/00000000-c474-81fa-8157-71aca5c5792e/raw?se=2026-09-17T13%3A01%3A30Z&sp=r&sv=2026-02-06&sr=b&scid=ce6e671c-6066-5900-910b-4384c27c30b9&skoid=cb94e22a-e3df-4e6a-9e17-1696f40fa435&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T02%3A46%3A38Z&ske=2026-09-18T02%3A46%3A38Z&sks=b&skv=2026-02-06&sig=6GgUPzQMbVMe9UnI/Ebc21ebluBHhWtlNDqyldvigDY%3D' \
            --output /tmp/client-v310.zip
          mkdir -p /tmp/client-v310
          unzip -o /tmp/client-v310.zip -d /tmp/client-v310
          test -f /tmp/client-v310/app-release.apk
          echo '744cc771b6610a1c731baca3377d4199451ac8cf75292d1f5d4e98ca7ce6a39c  /tmp/client-v310/app-release.apk' | sha256sum -c -

      - name: Publish APK and updater manifest
        run: |
          mkdir -p client-app-download
          cp /tmp/client-v310/app-release.apk client-app-download/TechGeekPH-Client-v3.1.0.apk
          cp /tmp/client-v310/app-release.apk client-app-download/TechGeekPH-Client-latest.apk
          base64 -w0 /tmp/client-v310/app-release.apk > client-app-download/TechGeekPH-Client-v3.1.0.apk.b64
          cat > client-app-download/latest.json <<'JSON'
          {
            "versionCode": 310,
            "versionName": "3.1.0",
            "apkBase64Url": "https://techgeek-ph.github.io/Payment-Center-V1.0/client-app-download/TechGeekPH-Client-v3.1.0.apk.b64",
            "message": "A TechGeekPH Client update is available. This version adds working chat photo upload and the built-in app updater for future releases.",
            "required": false,
            "sha256": "744cc771b6610a1c731baca3377d4199451ac8cf75292d1f5d4e98ca7ce6a39c"
          }
          JSON

      - name: Commit published updater files
        run: |
          git config user.name 'TechGeekPH Build Bot'
          git config user.email '137922253+TechGeek-PH@users.noreply.github.com'
          git add client-app-download/TechGeekPH-Client-v3.1.0.apk \
                  client-app-download/TechGeekPH-Client-latest.apk \
                  client-app-download/TechGeekPH-Client-v3.1.0.apk.b64 \
                  client-app-download/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish permanent-signed TechGeekPH Client v3.1.0'
            git push origin HEAD:main
          fi
