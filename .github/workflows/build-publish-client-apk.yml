name: Build and Publish TechGeekPH Client APK

on:
  push:
    branches:
      - main
    paths:
      - 'android-client-publish/**'
      - '.github/workflows/build-publish-client-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK to public download folder
        working-directory: .
        run: |
          cp android-client-publish/app/build/outputs/apk/debug/app-debug.apk client-app-download/TechGeekPH-Client-v3.0.0.apk

      - name: Commit exact APK binary
        working-directory: .
        run: |
          git config user.name "TechGeekPH Build Bot"
          git config user.email "137922253+TechGeek-PH@users.noreply.github.com"
          git add client-app-download/TechGeekPH-Client-v3.0.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified TechGeekPH Client v3 APK"
            git push origin HEAD:main
          fi
