name: Validate Legacy TechGeekPH Client Source

on:
  workflow_dispatch:

jobs:
  validate-legacy-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile legacy source only
        run: gradle :app:assembleDebug --no-daemon

      - name: Notice
        run: |
          echo 'This workflow no longer publishes APK files.'
          echo 'Production TechGeekPH Client releases use the permanent signing key and updater release pipeline.'
